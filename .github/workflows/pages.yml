name: Pages
# Publie la version 100 % navigateur (agents Python exécutés par Pyodide) sur GitHub Pages.
# À activer une fois : Settings > Pages > Build and deployment > Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger Pyodide (moteur Python du navigateur)
        run: |
          curl -sSL -o core.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.27.7/pyodide-core-0.27.7.tar.bz2
          mkdir core && tar -xjf core.tar.bz2 -C core
      - name: Construire la version navigateur
        run: python tools/build_static.py --pyodide core/pyodide --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
